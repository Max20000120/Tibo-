name: Check Codex Resets

on:
  schedule:
    # 每 5 分鐘執行一次（GitHub Actions 允許的最小排程間隔）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支援手動在 GitHub 後台點擊執行

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reset check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
        run: |
          python check_resets.py

      - name: Commit and push if state changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_reset_id.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update last reset id [skip ci]" && git push)
