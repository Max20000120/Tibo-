name: Check Codex Resets

on:
  schedule:
    # 每 5 分鐘執行一次（GitHub Actions 允許的最小排程間隔）
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '立即發送一則測試通知至 Discord'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reset check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "正在發送測試通知..."
            python check_resets.py --test
          else
            python check_resets.py
          fi

      - name: Commit and push if state changed
        if: ${{ inputs.test_mode != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_reset_id.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update last reset id [skip ci]" && git push)
